      padding: 0;
      box-sizing: border-box;

      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      position: relative;
      overflow: hidden;
      touch-action: pan-y;
      transition: background 1.5s ease;
    }
    #bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      transition: background 1.5s ease;
    }
    #celestial {
      position: fixed;
      top: 24px;
      right: 24px;
      font-size: 48px;
      z-index: 5;
      pointer-events: none;
      text-shadow: 0 0 40px rgba(255, 200, 100, 0.3);
      transition: all 1.5s ease;
    }
    .bg-heart, .bg-star {
      position: absolute;
      animation: floatUp linear infinite;
      opacity: 0.3;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-20vh) rotate(720deg); opacity: 0; }
    }
    .card {
      background: rgba(255, 240, 245, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 28px 22px 34px;
      border-radius: 48px;
      border: 1px solid rgba(255, 180, 200, 0.25);
      max-width: 440px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 2;
      margin: 20px 0 40px;
      transition: border-color 1s ease, box-shadow 1s ease;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }
    .top-bar .bear {
      font-size: 38px;
      line-height: 1;
      transition: color 1s ease;
    }
    #heart-container {
      width: 180px;
      height: 180px;
      margin: 10px auto 16px;
      position: relative;
      touch-action: manipulation;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #heart {
      font-size: 120px;
      line-height: 1;
      transition: transform 0.1s ease, text-shadow 0.2s ease;
      color: #ff4d6d;
      text-shadow: 0 0 40px rgba(255, 77, 109, 0.3);
      transform: scale(1);
      display: block;
      width: 100%;
      text-align: center;
    }
    #heart:active {
      transform: scale(0.85);
    }
    #heart.pulse {
      animation: pulse 0.3s ease;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    #click-counter {
      font-size: 20px;
      font-weight: 600;
      margin-top: 4px;
      transition: color 1s ease;
    }
    #phrase-block {
      min-height: 80px;
      margin: 12px 0 10px;
      padding: 14px;
      background: rgba(0,0,0,0.12);
      border-radius: 28px;
      border: 1px solid rgba(255, 150, 180, 0.1);
      transition: border-color 1s ease, background 1s ease;

    #phrase-text {

      font-weight: 600;
      line-height: 1.5;
      transition: color 1s ease;
    }
    .phrase-small {

      font-weight: 400;
      opacity: 0.8;
      margin-top: 6px;

    }
    .btn-group {

      justify-content: center;
      margin-top: 14px;

      border-radius: 40px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.06);

      -webkit-backdrop-filter: blur(4px);
      touch-action: manipulation;
      border: 1px solid rgba(255, 150, 180, 0.15);
      flex: 1 1 auto;
      min-width: 100px;
      transition: all 0.2s ease, background 1s ease, border-color 1s ease, color 1s ease;

    .btn:active {
      transform: scale(0.94);
      background: rgba(255, 77, 109, 0.2);
    }
    .btn-primary {

  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playSound(type) {
    try {
      initAudio();
      const now = audioCtx.currentTime;

      if (type === 'heartbeat') {
        // Два коротких удара
        playBeep(80, 0.08, now);
        playBeep(80, 0.08, now + 0.12);
      } else if (type === 'approach') {

        playBeep(freq, 0.1, now);
      } else if (type === 'win') {

        playBeep(659, 0.1, now + 0.12);
        playBeep(784, 0.1, now + 0.24);

      }

      // Звук не работает — просто игнорируем
    }
  }

  function playBeep(freq, duration, startTime) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(0.10, startTime);
      gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    } catch (e) {}
  }

    if (hours >= 6 && hours < 12) return 'morning';
    if (hours >= 12 && hours < 17) return 'day';
    if (hours >= 17 && hours < 21) return 'evening';
    return 'night';
  }

      } else {
        el.style.animationDuration = (12 + Math.random() * 15) + 's';
        el.style.animationDelay = Math.random() * 12 + 's';
      }
      container.appendChild(el);
    }
  }

  // =======================================================
  // 5. КЛИКЕР
  // =======================================================
  let clickCount = 0;
  const TARGET_CLICKS = 10;
  let phraseIndex = 0;
  const heart = document.getElementById('heart');
  const clickCounter = document.getElementById('click-counter');
  const phraseText = document.getElementById('phrase-text');
  const phraseDay = document.getElementById('phrase-day');

  let savedClicks = localStorage.getItem('clickCount');
  let savedPhraseIndex = localStorage.getItem('phraseIndex');
  if (savedClicks !== null) clickCount = parseInt(savedClicks, 10) || 0;
  if (savedPhraseIndex !== null) phraseIndex = parseInt(savedPhraseIndex, 10) || 0;

  if (clickCount >= TARGET_CLICKS) {
    showPhrase(phraseIndex);
    phraseIndex = (phraseIndex + 1) % PHRASES.length;
    localStorage.setItem('phraseIndex', phraseIndex);
    clickCount = 0;
    localStorage.setItem('clickCount', 0);
  }

  updateCounterDisplay();

  heart.addEventListener('click', function(e) {
    e.preventDefault();
    initAudio();

    this.classList.remove('pulse');
    void this.offsetWidth;
    this.classList.add('pulse');

    clickCount++;
    localStorage.setItem('clickCount', clickCount);
    updateCounterDisplay();

    // ЗВУКИ В ЗАВИСИМОСТИ ОТ КЛИКА
    if (clickCount <= 5) {
      playSound('heartbeat');
    } else if (clickCount < 10) {
      playSound('approach');
    }

    if (clickCount >= TARGET_CLICKS) {
      playSound('win');
      showPhrase(phraseIndex);
      burstHearts(30);
      phraseIndex = (phraseIndex + 1) % PHRASES.length;
      localStorage.setItem('phraseIndex', phraseIndex);
      clickCount = 0;
      localStorage.setItem('clickCount', 0);
      updateCounterDisplay();
    }
  });

  function updateCounterDisplay() {
    const remaining = TARGET_CLICKS - clickCount;
    if (remaining > 0) {
      clickCounter.textContent = `❤️ Осталось ${remaining} нажатий до фразы`;
    } else {
      clickCounter.textContent = '❤️ Ты нажал на моё сердце!';
    }
  }

  function showPhrase(index) {
    const phrase = PHRASES[index];
    phraseText.textContent = phrase;
    phraseDay.textContent = `❤️ Твоя фраза (${index + 1}/${PHRASES.length})`;
    document.getElementById('phrase-block').style.borderColor = 'rgba(255, 77, 109, 0.4)';
  }

  // =======================================================
  // 6. ВЗРЫВЫ
  // =======================================================
  function burstHearts(count) {
    const emojis = ['❤️','💖','💗','💓','🌸','✨','💕','🩷','💋','🥰','💞','🌟','🧡','💘','🐱','😺'];
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'burst';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = (10 + Math.random() * 75) + '%';
        el.style.top = (10 + Math.random() * 75) + '%';
        el.style.setProperty('--tx', (Math.random() * 400 - 200) + 'px');
        el.style.setProperty('--ty', (Math.random() * -400 - 50) + 'px');
        el.style.fontSize = (25 + Math.random() * 55) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1200);
      }, i * 50);
    }
  }

  // =======================================================
  // 7. СЧЁТЧИК ДНЕЙ
  // =======================================================
  function updateDayCounter() {
    const start = new Date(2023, 9, 5);
    const now = new Date();
    const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
    document.getElementById('day-counter').textContent =
      '❤️ С того дня, как я тебя увидела, прошло ' + diff + ' дней';
  }
  updateDayCounter();

  // =======================================================
  // 8. КНОПКИ
  // =======================================================
  document.getElementById('replyBtn').addEventListener('click', function() {
    const block = document.getElementById('reply-block');
    block.style.display = block.style.display === 'flex' ? 'none' : 'flex';
    if (block.style.display === 'flex') document.getElementById('replyText').focus();
  });

  document.getElementById('sendReplyBtn').addEventListener('click', function() {
    const text = document.getElementById('replyText').value.trim();
    if (!text) return;
    const full = text + ' (отправлено через сердечко ❤️)';
    navigator.clipboard.writeText(full).then(() => {
      window.open('https://t.me/' + YOUR_TG, '_blank');
      document.getElementById('replyText').value = '';
      document.getElementById('reply-block').style.display = 'none';
      burstHearts(20);
    });
  });

  // =======================================================
  // 9. ЗАПУСК
  // =======================================================
  const now = new Date();
  const hours = now.getHours();
  const theme = getTimeTheme(hours);
  applyTheme(theme);

  console.log('🧸 Финальная версия со звуками загружена!');
</script>
</body>
</html>
